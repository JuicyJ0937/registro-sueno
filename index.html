<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f26">
<title>Registro de sueño</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="fase-noche">
<div class="cielo" aria-hidden="true"><div class="astro"></div><div id="estrellas"></div></div>

<main id="app">
  <!-- Configuración inicial -->
  <section id="config" class="pantalla config" hidden>
    <div class="logo"></div>
    <h1>Registro de sueño</h1>
    <p class="suave">Primera vez en este móvil. Abre el enlace de configuración que te pasó la otra persona, o rellena los datos.</p>
    <label>Nombre del bebé <input id="cfg-bebe" autocomplete="off"></label>
    <label>Tu nombre <input id="cfg-autor" placeholder="Papá, Mamá…" autocomplete="off"></label>
    <label>URL del servidor <input id="cfg-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Token <input id="cfg-token" autocomplete="off"></label>
    <button id="cfg-guardar" class="btn primario">Empezar</button>
    <button id="cfg-demo" class="btn">Probar en modo demo</button>
    <p id="cfg-error" class="error" hidden></p>
  </section>

  <!-- Pantalla principal -->
  <section id="principal" class="pantalla" hidden>
    <header class="barra">
      <div>
        <div class="titulo" id="titulo"></div>
        <div class="fecha-hoy" id="fecha-hoy"></div>
      </div>
      <span class="espacio"></span>
      <button id="sync" class="sync"></button>
      <button id="menu-btn" class="icono-btn" aria-label="Menú"></button>
    </header>
    <nav class="pestanas" id="pestanas"><button data-v="ahora" class="on">Ahora</button><button data-v="historial">Historial</button></nav>

    <div id="vista-ahora">
    <div class="nav-jornada"><button id="j-prev" aria-label="Jornada anterior">‹</button><div class="j-txt"><b id="j-titulo"></b><small id="j-sub"></small></div><button id="j-next" aria-label="Jornada siguiente">›</button></div>
    <div class="reloj-24">
      <svg id="dial" viewBox="0 0 340 340" aria-label="Reloj de 24 horas"></svg>
      <div class="centro" id="centro">
        <div class="c-etiqueta" id="c-etiqueta"></div>
        <div class="c-tiempo" id="c-tiempo"></div>
        <div class="c-sub" id="c-sub"></div>
      </div>
    </div>

    <div id="acciones" class="acciones"></div>

    <section id="proximo" class="tarjeta proximo" hidden></section>
    <section id="total-jornada" class="tarjeta"></section>
    <section id="anoche" class="tarjeta"></section>
    <section id="hoy" class="tarjeta"></section>
    <section id="tendencia" class="tarjeta"></section>
    <section class="tarjeta">
      <div class="tarjeta-cab"><h2>Registro</h2><button class="mini" id="nuevo-btn">+ Añadir</button></div>
      <ul id="registro" class="registro"></ul>
    </section>
    </div>

    <div id="vista-historial" hidden></div>
    <p class="pie" id="pie"></p>
  </section>
</main>

<div id="aviso" class="aviso" hidden></div>
<dialog id="hoja" class="hoja"><div class="asa"></div><div id="hoja-cont"></div></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
