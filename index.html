<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131f">
<title>Registro de sueño</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main id="app">
  <!-- Configuración inicial -->
  <section id="config" class="pantalla" hidden>
    <h1>Registro de sueño</h1>
    <p class="suave">Primera vez en este móvil. Abre el enlace de configuración que te pasó la otra persona, o rellena los datos.</p>
    <label>Nombre del bebé <input id="cfg-bebe" autocomplete="off"></label>
    <label>Tu nombre <input id="cfg-autor" placeholder="Papá, Mamá…" autocomplete="off"></label>
    <label>URL del servidor <input id="cfg-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Token <input id="cfg-token" autocomplete="off"></label>
    <button id="cfg-guardar" class="btn primario">Empezar</button>
    <button id="cfg-demo" class="btn">Probar en modo demo (sin guardar nada)</button>
    <p id="cfg-error" class="error" hidden></p>
  </section>

  <!-- Pantalla principal -->
  <section id="principal" class="pantalla" hidden>
    <header class="barra">
      <span class="titulo" id="titulo"></span>
      <button id="sync" class="sync" title="Sincronización"></button>
      <button id="menu-btn" class="icono" aria-label="Menú">⋮</button>
    </header>

    <div id="estado" class="estado">
      <div id="estado-etiqueta" class="etiqueta"></div>
      <div id="estado-reloj" class="reloj"></div>
      <div id="estado-sub" class="sub"></div>
    </div>

    <div id="acciones" class="acciones"></div>

    <section class="tarjeta" id="hoy"></section>
    <section class="tarjeta" id="anoche"></section>

    <section class="tarjeta">
      <h2>Registro</h2>
      <ul id="registro" class="registro"></ul>
    </section>
  </section>
</main>

<div id="aviso" class="aviso" hidden></div>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-titulo"></h2>
    <div id="editor-campos"></div>
    <div class="fila-botones">
      <button value="borrar" class="btn peligro" id="editor-borrar">Borrar</button>
      <span class="espacio"></span>
      <button value="cancelar" class="btn">Cancelar</button>
      <button value="guardar" class="btn primario">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="ficha">
  <form method="dialog">
    <h2 id="ficha-titulo">Ficha de la noche</h2>
    <label class="check"><input type="checkbox" id="ficha-mala"> Noche mala</label>
    <label>Notas <textarea id="ficha-notas" rows="3"></textarea></label>
    <p class="suave">Solo si se olvidó el modo acostar (si no, se calculan solos):</p>
    <div class="dos">
      <label>Latencia (min) <input id="ficha-latencia" type="number" min="0" inputmode="numeric"></label>
      <label>Llanto (min) <input id="ficha-llanto" type="number" min="0" inputmode="numeric"></label>
    </div>
    <div class="fila-botones">
      <span class="espacio"></span>
      <button value="cancelar" class="btn">Cancelar</button>
      <button value="guardar" class="btn primario">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="menu">
  <form method="dialog">
    <h2>Opciones</h2>
    <button value="nuevo" class="btn">+ Añadir un registro olvidado</button>
    <button value="compartir" class="btn">Compartir configuración con la otra persona</button>
    <button value="sync" class="btn">Sincronizar ahora</button>
    <button value="salir" class="btn peligro">Cerrar sesión en este móvil</button>
    <button value="cancelar" class="btn">Cerrar</button>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
